name: tf-checks
permissions:
  id-token: write
on:
  pull_request:
jobs:
  ec2-network-mode-awsvpc:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './examples/ec2-network-mode-awsvpc/'
      provider: aws
      enable_plan: true
      show_plan: false
    secrets: 
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
  ec2-network-mode-bridge:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './examples/ec2-network-mode-bridge/'
      provider: aws
      enable_plan: true
      show_plan: false
    secrets: 
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
  fargate:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './examples/fargate/'
      provider: aws
      enable_plan: true
      show_plan: false
    secrets: 
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}

